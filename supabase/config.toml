# Configuración de la Supabase CLI para Unities.
# `project_id` es solo una etiqueta local; el proyecto real se vincula con
# `supabase link --project-ref <ref>`.
project_id = "unities-app"

[db]
major_version = 15

[auth]
# Registro/login por OTP o magic link al correo institucional.
enable_signup = true
# Sin passwords: solo email OTP / magic link.
[auth.email]
enable_signup = true
enable_confirmations = true
# OTP de 6 dígitos válido 1 hora.
otp_length = 6
otp_expiry = 3600

[functions.expire-payments]
verify_jwt = false

# Sesión 8 — pagos avanzados.
# create-payment-intent exige sesión (autentica al pasajero por su JWT).
[functions.create-payment-intent]
verify_jwt = true

# El webhook de Fintoc llega sin sesión: se valida por FIRMA (FINTOC_WEBHOOK_SECRET),
# no por JWT.
[functions.fintoc-webhook]
verify_jwt = false

# Sesión Bots de IA — solo la invoca el trigger interno notify_ai_bot_on_message
# (pg_net), sin sesión de usuario: se valida el payload, no un JWT.
[functions.ai-bot-reply]
verify_jwt = false
